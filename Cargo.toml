[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "0.3.5" }
gpui-base = "0.6.4"
gpui_platform = { package = "gpui-pre-platform", version = "0.3.5", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
futures = "0.3"
rig = { git = "https://github.com/0xPlaygrounds/rig", rev = "2d16c1b25f6749b3a2cd841beddf767106495069" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

uuid = { version = "1", features = ["v4"] }
