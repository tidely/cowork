[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.dependencies]
agent = { path = "crates/agent" }
draft = { path = "crates/draft" }
tools = { path = "crates/tools" }

anyhow = "1"
base64 = "0.22"
async-channel = "2"
chrono = "0.4"
# Must match the GPUI snapshot gpui-kit pins.
gpui = { package = "gpui-pre", version = "=0.3.6" }
# Upstream main plus `RenderedText::source` and `RenderedText::range_for_source`.
gpui-base = { git = "https://github.com/tidely/gpui-kit", branch = "text-view-source-range-highlights" }
gpui-component = { git = "https://github.com/tidely/gpui-kit", branch = "text-view-source-range-highlights" }
gpui-kit-assets = { git = "https://github.com/tidely/gpui-kit", branch = "text-view-source-range-highlights" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
futures = "0.3"
iroh = "1.2.0"
itertools = "0.14"
nucleo-matcher = "0.3"
postcard = { version = "1.1.3", features = ["use-std"] }
rig = { git = "https://github.com/0xPlaygrounds/rig", rev = "5fe9269407f1439be82fa3b7dd71e2d85bdf5ce3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4", "v5"] }
yrs = "0.28"
