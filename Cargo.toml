[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
# Switch to upstream after https://github.com/0xPlaygrounds/rig/pull/1586 is merged
rig-core = { git = "https://github.com/tidely/rig.git", branch = "feat/streaming-tool-concurrency", package = "rig-core", features = ["pdf"] }
rig-derive = { git = "https://github.com/tidely/rig.git", branch = "feat/streaming-tool-concurrency", package = "rig-derive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
futures-util = "0.3"
tokio-util = "0.7"
ratatui = "0.29"
crossterm = "0.28"
