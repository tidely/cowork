[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.dependencies]
agent = { path = "crates/agent" }
draft = { path = "crates/draft" }
sandbox = { path = "crates/sandbox" }
tools = { path = "crates/tools" }

anyhow = "1"
base64 = "0.22"
async-channel = "2"
chrono = "0.4"
dashmap = "6.2"
# Must match the GPUI snapshot gpui-kit pins.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-base = "0.7.1"
gpui-component = "0.7.1"
gpui-kit-assets = "0.7.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
futures = "0.3"
iroh = "1.2.0"
itertools = "0.14"
# Pinned exactly: the crate is beta, its runtime must match its version, and
# `sandbox::RUNTIME_ARCHIVES` pins that runtime's digests. Default features are
# off: no cloud client, no keychain access, and no build-time download of the
# runtime (it is installed at first use, checked against a pinned SHA-256).
microsandbox = { version = "=0.7.7", default-features = false, features = ["local", "net"] }
nucleo-matcher = "0.3"
postcard = { version = "1.1.3", features = ["use-std"] }
rig = "0.44.0"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4", "v5"] }
yrs = "0.28"
