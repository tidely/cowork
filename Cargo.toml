[workspace]
members = [
    "crates/agent",
    "crates/agent-input",
    "crates/agent-runtime",
    "crates/cowork",
    "crates/draft",
    "crates/language-model",
    "crates/provider-sse",
    "crates/sandbox",
    "crates/tools",
    "crates/tool-runtime",
    "crates/providers/*/types",
    "crates/providers/*/client",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]

[workspace.lints.clippy]
disallowed_types = "deny"

[workspace.dependencies]
provider-sse = { path = "crates/provider-sse" }
agent = { path = "crates/agent" }
agent-input = { path = "crates/agent-input" }
agent-runtime = { path = "crates/agent-runtime" }
draft = { path = "crates/draft" }
sandbox = { path = "crates/sandbox" }
tools = { path = "crates/tools" }
tool-runtime = { path = "crates/tool-runtime" }
language-model = { path = "crates/language-model" }
ollama-types = { path = "crates/providers/ollama/types" }
ollama = { path = "crates/providers/ollama/client" }
openai-compatible-types = { path = "crates/providers/openai-compatible/types" }
openai-compatible = { path = "crates/providers/openai-compatible/client" }
anthropic-types = { path = "crates/providers/anthropic/types" }
anthropic = { path = "crates/providers/anthropic/client" }

anyhow = "1"
base64 = "0.22"
async-channel = "2"
chrono = { version = "0.4", features = ["serde"] }

# Must match the GPUI snapshot gpui-kit pins.
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui-base = "0.8.1"
gpui-component = "0.8.1"
gpui-kit-assets = "0.8.1"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = [
    "font-kit",
    "wayland",
    "x11",
    "runtime_shaders",
] }
futures = "0.3"
# Parses HTTP-date `Retry-After` values in the provider clients.
httpdate = "1"
iroh = "1.4.1"
itertools = "0.14"
libc = "0.2"
# Contains the agent's commands with the operating system's own sandbox:
# Seatbelt on macOS, Bubblewrap on Linux, a process container on Windows. No
# optional backends; telemetry stays off as no request opts in.
mxc-sdk = "1.0.1"
mime = "0.3"
nucleo-matcher = "0.3"
parking_lot = "0.12"
postcard = { version = "1.1.3", features = ["use-std"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "rustls",
] }
# Evaluates scheduled tasks' custom RFC 5545 recurrence rules.
rrule = "0.14"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Turns a file's old and new text into the unified patch `gpui_component::diff` shows.
similar = "2.7"
syntect = { version = "5.3", default-features = false, features = [
    "default-fancy",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4", "v5"] }
# Lists the Windows drives commands may read; see `sandbox::settings`.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
yrs = "0.28"
